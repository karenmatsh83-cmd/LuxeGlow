<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make an Enquiry | LuxeGlow Beauty & Cosmetics</title>

    <meta name="description" content="Contact LuxeGlow Beauty and Cosmetics with questions about our beauty products and services.">

    <meta name="keywords" content="LuxeGlow, beauty products, cosmetics, skincare, makeup enquiry">

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <header>
       <img src="luxeglow-logo.png"

        <h1>Make an Enquiry</h1>
        <p>We are happy to help you</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Products</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Contact LuxeGlow</h2>

            <p>
                If you have any questions about our beauty products,
                please complete the form below.
            </p>

            <form id="enquiry-form">

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required minlength="2">
                <br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" required>
                <br><br>

                <label for="message">Your Enquiry:</label><br>
                <textarea id="message" name="message"
                          rows="5" cols="30"
                          required minlength="10"></textarea>
                <br><br>

                <input type="submit" value="Submit Enquiry">

            </form>

            <p id="form-message" role="status"></p>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
