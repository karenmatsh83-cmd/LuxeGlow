<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beauty Products | LuxeGlow Beauty & Cosmetics</title>

    <meta name="description" content="Explore skincare, makeup and beauty accessories at LuxeGlow Beauty and Cosmetics. Find products for your everyday beauty routine.">

    <meta name="keywords" content="LuxeGlow, beauty products, skincare, makeup, cosmetics, beauty accessories">

    <meta name="author" content="LuxeGlow Beauty & Cosmetics">

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <header>
        <img src="images/luxeglow-logo.png"
             alt="LuxeGlow Beauty and Cosmetics Logo">

        <h1>LuxeGlow Products</h1>

        <p>Beauty products for your everyday needs</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Products</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Explore Our Products</h2>

            <p>
                Discover our skincare, makeup and beauty accessories.
                Search for products or sort them alphabetically.
            </p>

            <label for="product-search">Search Products:</label>

            <input type="text"
                   id="product-search"
                   placeholder="Enter a product name or category">

            <br><br>

            <label for="product-sort">Sort Products:</label>

            <select id="product-sort">
                <option value="">Default order</option>
                <option value="ascending">A to Z</option>
                <option value="descending">Z to A</option>
            </select>
        </section>

        <section>
            <h2>Available Beauty Products</h2>

            <div class="product-container" id="product-list">
                <!-- JavaScript displays products here -->
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 LuxeGlow Beauty & Cosmetics.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
